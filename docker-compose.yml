# BoB Sentinel — local MVP stack.
#   docker compose up -d
#   docker compose run --rm api python scripts/init_db.py --fallback-eez
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-bobsentinel}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # The app must not start until Postgres is actually accepting queries.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-bobsentinel}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - sardata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  ais-ingest:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command: python -m bob_sentinel.workers.ais_ingest
    restart: unless-stopped

  # On-demand: `docker compose run --rm sar-worker python -m bob_sentinel.workers.sar_process --days 7`
  sar-worker:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - sardata:/data
    command: ["python", "-m", "bob_sentinel.workers.sar_process", "--catalogue-only"]
    profiles: ["workers"]

  # On-demand: `docker compose run --rm anomaly-scan`
  anomaly-scan:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "bob_sentinel.workers.anomaly_scan", "--hours", "48"]
    profiles: ["workers"]

volumes:
  pgdata:
  sardata:
